name: Metrics

on:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Run Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          config: |
            plugin_individual: true
          outputs: |
            ${commenter.plugin_summary}